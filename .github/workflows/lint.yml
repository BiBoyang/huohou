name: skill-lint

on:
  push:
    paths:
      - "huohou-*/SKILL.md"
      - "huohou-*/references/**"
      - "evals-shared/**"
      - ".github/workflows/lint.yml"
  pull_request:
    paths:
      - "huohou-*/SKILL.md"
      - "huohou-*/references/**"
      - "evals-shared/**"
      - ".github/workflows/lint.yml"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Lint skills
        run: python3 evals-shared/lint_skill.py
      - name: Eval tooling selftest (known-bad fixture must still be caught)
        run: python3 evals-shared/selftest.py
