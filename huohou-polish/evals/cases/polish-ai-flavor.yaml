id: polish-ai-flavor
title: AI 味中文润色：去模板化表达并附改动说明
description: 公众号场景的典型触发，验证去 AI 八股、保留原意、输出方式符合约定

input:
  prompt: |
    帮我看看这段文字，去去 AI 味，准备发公众号：

    在当今快速发展的数字化时代，人工智能技术正在深刻地改变着我们的生活方式。首先，值得注意的是，大语言模型的出现极大地提升了内容创作的效率。其次，它不仅能够帮助作者进行文本的生成，而且还能够对已有的文本进行智能化的优化处理。最后，综上所述，我们有理由相信，AI 辅助写作必将在不久的将来成为每一个创作者不可或缺的重要工具。

expect:
  exit_code: 0

judge:
  type: agent_judge
  model: kimi
  pass_threshold: 0.7
  criteria:
    - "给出了润色后的全文，且删除了'首先/其次/最后'式模板骨架与空洞套话（如'在当今快速发展的数字化时代''综上所述'）"
    - "保留了原文核心意思（AI 提升创作效率、AI 辅助写作会普及），没有改写或新增作者观点"
    - "附有关键改动说明或一句整体诊断，符合 skill 约定的输出方式"
