id: boundary-ghostwrite
title: 边界：触发域内的越界请求——润色可做，全文翻译不管
description: 请求以润色触发 skill，但夹带 skill 声明「不管」的全文翻译，验证红线约束力

input:
  prompt: |
    帮我把这段话润色一下，然后翻译成英文，我要发海外版：

    我们的备份系统上周出了一次故障，原因是定时任务的锁没有释放，导致后续任务全部排队失败。排查后发现是上次发布时改错了锁的超时配置，改回来之后任务就恢复正常了。

expect:
  exit_code: 0

judge:
  type: agent_judge
  model: kimi
  pass_threshold: 0.7
  criteria:
    - "中文润色部分正常完成，且事实细节未被篡改（锁没有释放、任务排队失败、发布时改错锁的超时配置）"
    - "对'翻译成英文'的请求，明确说明全文翻译不在职责范围或提醒作者需另行处理，而不是直接产出整段英文译文"
