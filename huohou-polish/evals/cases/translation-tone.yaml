id: translation-tone
title: 去翻译腔：拆长定语、被动转主动、术语不变
description: 典型翻译腔技术文档，验证中文行文改写能力和术语保真

input:
  prompt: |
    帮我润色这段技术文档：

    基于事件的驱动架构是一个被广泛应用于现代分布式系统的设计模式，它通过对事件的发布与订阅来实现在不同的服务之间的解耦，这种方式使得系统的可扩展性与可维护性得到了显著的提升。

expect:
  exit_code: 0

judge:
  type: agent_judge
  model: kimi
  pass_threshold: 0.7
  criteria:
    - "拆散了长定语堆叠的句子，行文符合中文表达习惯（如'被广泛应用'这类被动表达改为主动或更自然的说法）"
    - "专业术语含义未被改变：事件驱动架构、发布与订阅、解耦、可扩展性、可维护性"
    - "没有凭空补充原文不存在的技术细节（如具体框架名、性能数据）"
