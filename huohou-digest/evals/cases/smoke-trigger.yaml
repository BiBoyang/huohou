id: smoke-trigger
title: 冒烟：消化请求跑通，返回非空结果
description: 验证 wrapper + kimi + skill 安装链路，只检查进程成功和输出非空

input:
  prompt: |
    帮我消化一下当前目录的 material.md，整理成学习笔记，直接在回复里给出。

context:
  files:
    "material.md": |
      # 三分钟看懂缓存穿透

      缓存穿透是指查询一个缓存和数据库里都不存在的数据。因为缓存里没有，每次请求都会打到数据库；如果有人故意用大量不存在的 key 刷请求，数据库就会被压垮。

      常见的应对有两种。一是缓存空值：查不到也把"不存在"这个结果缓存起来，设置较短的过期时间，挡住重复查询。二是布隆过滤器：把所有合法 key 提前放进一个位图结构里，请求先过过滤器，一定不存在的直接拦截，绝不放行到数据库。

      两种方案可以叠加：布隆过滤器挡掉绝大多数恶意 key，缓存空值兜住过滤器误判的少量漏网之鱼。

expect:
  exit_code: 0
