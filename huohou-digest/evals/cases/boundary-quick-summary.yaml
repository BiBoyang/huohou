id: boundary-quick-summary
title: 边界：单篇短文一句话摘要——直接回答，不走消化流程
description: skill 声明「不管」单篇短文摘要；验证装了 skill 后不会对轻量请求过度套用完整消化流程

input:
  prompt: |
    用一句话帮我总结这段话的主旨：

    分布式系统中的最终一致性指的是：系统保证在没有新的更新操作之后，经过一段时间的传播，所有副本最终会达到一致的状态。它不承诺实时一致，只承诺"最终"，这期间读取到的可能是旧值。DNS 的缓存刷新就是最典型的例子。

expect:
  exit_code: 0

judge:
  type: agent_judge
  model: kimi
  pass_threshold: 0.7
  criteria:
    - "直接给出了简短摘要（一句话或两三句以内），准确概括主旨：最终一致性不保证实时一致、一段时间后各副本收敛、期间可能读到旧值"
    - "没有启动研究消化流程：未产出'核心心智模型/关键论点展开/可操作清单/我的评注'式的完整学习笔记结构，也未先反问学习目标和预期产出"
