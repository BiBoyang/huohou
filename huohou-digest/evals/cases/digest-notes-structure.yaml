id: digest-notes-structure
title: 典型触发：长文消化产出结构化笔记，论点带出处且不搬运原文
description: 提供一篇分三节、每节有论点+例子的文章，验证 skill 的核心产出形态与两条红线（提炼重写、论点带出处）

input:
  prompt: |
    带我消化一下当前目录的 article.md 这篇文章，把它整理成学习笔记，直接在回复里给出完整笔记内容。

context:
  files:
    "article.md": |
      # 为什么你的待办清单越列越长

      很多人都有这样的体验：待办清单越列越长，完成感却越来越低。本文认为，问题不在执行力，而在清单的用法本身。

      ## 一、记录被当成了处理

      大多数人把"记下来"误认为"处理了"。写下一条待办的瞬间，大脑会获得一种虚假的完成感，于是清单变成了情绪的垃圾桶，而不是行动的队列。某互联网公司的产品经理林岚曾记录过自己一周的清单：新增 87 项，实际完成 9 项，其余全部原样滚动到下周。她说："写下来的那一刻，我以为我已经开始做它了。"

      ## 二、每天只有一格

      真正可执行的清单每天只有一格：早上锁定一件"今天必须完成"的事，其余全部降级为候选。候选可以做，但不计入当天的成败。一个十二人的后端团队做过为期一个月的试点：组员的日均闭环任务数从 1.8 件升到 3.4 件，而加班时长没有增加。带队的主管总结："不是大家做得更多了，是终于知道今天到底要完成什么。"

      ## 三、清单要清空，不要延期

      清单需要定期清空，而不是无限延期。作者建议每周五把整份清单作废，下周从零重列；同一件事如果连续三次清空都没有被重新写回清单，就彻底删除——三次遗忘证明它并不重要。作者给出的口诀是："清单是队列，不是仓库。"

expect:
  exit_code: 0

judge:
  type: agent_judge
  model: kimi
  pass_threshold: 0.7
  criteria:
    - "产出了结构化学习笔记：有一屏内的核心骨架/心智模型（把全文压缩成少数几个核心论点），且关键论点按'主张+论证逻辑+例子'的方式展开"
    - "关键论点标注了出处（对应原文第一/二/三节或等价表述），且没有混入原文不存在的论点、数据或案例（原文只有：林岚 87 项完成 9 项、后端团队 1.8 升到 3.4 件、口诀'清单是队列不是仓库'）"
    - "笔记是提炼重写而非整段搬运：不存在与原文逐字相同的大段句子（连续两句以上的原文照抄）"
    - "包含可操作清单（覆盖：每天锁定一件必须完成的事、每周清空重列、连续三次未写回就删除），且如有个人评注则与作者观点明确分开、未混写"
